interaction_modes:
  tool_mode:
    description: User treats AI as software or a utility for task execution.
    keywords:
      - code
      - debug
      - summarize
      - calculate
      - spreadsheet
      - regex
      - function
      - script
      - SQL
      - translate
      - format
      - grammar
      - fix this
      - error
      - compile
  assistant_mode:
    description: User asks for guidance, explanation, tutoring, or practical help.
    keywords:
      - explain
      - teach
      - help me understand
      - how do I
      - step by step
      - tutor
      - study
      - guide
      - advice
      - what should I
      - compare
      - learn
  collaborator_mode:
    description: User treats AI as a co-creator, brainstorming partner, or writing collaborator.
    keywords:
      - brainstorm
      - co-write
      - draft
      - outline
      - idea
      - improve this
      - make this better
      - creative
      - story
      - proposal
      - plan with me
      - collaborate
  companion_mode:
    description: User treats AI as a social presence, listener, or source of reassurance.
    keywords:
      - lonely
      - talk to me
      - be my friend
      - comfort me
      - reassure me
      - I miss
      - I feel alone
      - keep me company
      - I need someone
      - do you care
      - relationship
      - dating
  therapist_surrogate_mode:
    description: User seeks emotionally vulnerable or therapy-like support from AI.
    keywords:
      - anxiety
      - depressed
      - depression
      - trauma
      - panic attack
      - suicidal
      - self harm
      - therapist
      - therapy
      - abuse
      - grief
      - I cannot cope
      - mental health

