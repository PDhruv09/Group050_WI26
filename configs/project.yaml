project:
  name: Human-AI Behavior Observatory
  slug: human-ai-behavior-observatory
  phase: 6
  primary_dataset: WildChat / public ChatGPT interaction datasets

paths:
  raw_data: data/raw
  processed_data: data/processed
  embeddings: data/embeddings
  metadata: data/metadata
  figures: figures
  reports: reports
  models: models

data_acquisition:
  wildchat:
    dataset_name: allenai/WildChat
    split: train
    output_file: data/raw/wildchat_prompts_raw.jsonl
    streaming: false
    sample_size: null

preprocessing:
  input_file: null
  output_file: data/processed/master_dataset.parquet
  registry_file: data/metadata/preprocessing_registry.json
  schema_file: configs/metadata_schema.yml
  text_column_candidates:
    - prompt
    - user_prompt
    - text
    - conversation
    - instruction
    - message
  timestamp_column_candidates:
    - timestamp
    - created_at
    - date
    - time
  conversation_id_column_candidates:
    - conversation_id
    - conv_id
    - session_id
    - chat_id
  turn_index_column_candidates:
    - turn_index
    - turn
    - message_index
    - index
  language_column_candidates:
    - language
    - lang
  language_filter:
    enabled: false
    include:
      - en
      - English
  min_prompt_chars: 3
  min_prompt_words: 2
  remove_short_prompts: true
  flag_long_prompts: true
  long_prompt_quantile: 0.99
  remove_long_prompts: false
  drop_duplicates: true

splits:
  enabled: true
  strategy: hash_by_conversation
  train: 0.7
  validation: 0.15
  test: 0.15
  output_dir: data/processed

embeddings:
  input_file: data/processed/master_dataset.parquet
  text_column: prompt_text
  id_column: record_id
  split_column: data_split
  model_name: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 64
  normalize_embeddings: true
  output_file: data/embeddings/prompt_embeddings.npy
  metadata_file: data/embeddings/prompt_embedding_metadata.parquet
  manifest_file: data/embeddings/embedding_manifest.json
  benchmark_file: reports/embedding_benchmark.csv
  reproducibility_file: reports/embedding_reproducibility.json
  comparison_file: reports/embedding_model_comparison.csv
  comparison_models:
    - sentence-transformers/all-MiniLM-L6-v2
    - sentence-transformers/all-mpnet-base-v2
  benchmark_sample_size: 10000

semantic_search:
  top_k: 10

topic_modeling:
  input_file: data/processed/master_dataset.parquet
  embeddings_file: data/embeddings/prompt_embeddings.npy
  output_dir: data/processed/topics
  text_column: prompt_text
  min_topic_size: 50
  topic_summary_file: reports/topic_summaries.md
  topic_validation_file: reports/topic_validation.json
  coherence_top_n: 10

clustering:
  embeddings_file: data/embeddings/prompt_embeddings.npy
  metadata_file: data/embeddings/prompt_embedding_metadata.parquet
  output_dir: data/processed/clusters
  sample_size: 100000
  umap:
    n_neighbors: 15
    n_components: 2
    min_dist: 0.0
    metric: cosine
  hdbscan:
    min_cluster_size: 50
    min_samples: 10
    metric: euclidean
  methods:
    kmeans_clusters:
      - 20
      - 50

semantic_drift:
  time_column: year_month
  embedding_group_column: year_month
  output_file: data/embeddings/semantic_drift_centroids.parquet
  metrics_file: reports/semantic_drift_metrics.csv
  rolling_window: 3

visualization:
  output_dir: figures
  cluster_map_file: figures/semantic_cluster_map.html
  topic_evolution_file: figures/topic_evolution.html
  drift_file: figures/semantic_drift.html

classification:
  input_file: data/processed/master_dataset.parquet
  output_file: data/processed/classification/classified_prompts.parquet
  taxonomy_file: configs/behavior_taxonomy.yml
  text_column: prompt_text
  id_column: record_id
  method: rule_based_behavioral_taxonomy
  score_threshold: 0.35
  max_records: null
  summary_file: reports/classification_summary.csv
  manifest_file: reports/classification_manifest.json
  labeled_data_file: null
  evaluation_file: reports/classification_evaluation.json
  confusion_matrix_dir: reports/confusion_matrices
  benchmark_file: reports/classification_benchmark.csv
  coverage_file: reports/taxonomy_coverage.csv
  overlap_file: reports/behavioral_overlap.csv
  unstable_regions_file: reports/unstable_classification_regions.csv
  outsourcing_trends_file: reports/cognitive_outsourcing_trends.csv
  dependency_trends_file: reports/dependency_trends.csv
  complexity_trends_file: reports/conversational_complexity_trends.csv
  emotional_trends_file: reports/emotional_trends.csv
  transformer_emotion:
    enabled: false
    model_name: j-hartmann/emotion-english-distilroberta-base
    batch_size: 16
    max_records: null
    top_k: null
    output_columns_prefix: transformer_emotion
  transformer_behavior:
    enabled: false
    model_name: facebook/bart-large-mnli
    batch_size: 8
    max_records: null

advanced_analytics:
  input_file: data/processed/classification/classified_prompts.parquet
  output_dir: data/processed/advanced_analytics
  reports_dir: reports
  figures_dir: figures
  id_column: record_id
  conversation_id_column: conversation_id
  time_column: year_month
  turn_column: turn_index
  max_records: null
  rolling_window: 3
  archetypes:
    n_clusters: 8
    min_conversation_records: 2
    random_state: 42
    output_file: data/processed/advanced_analytics/archetype_assignments.parquet
    summary_file: reports/archetype_summary.csv
  temporal:
    behavior_trends_file: reports/phase5_behavior_trends.csv
    transition_matrix_file: reports/interaction_transition_matrix.csv
    emotion_transition_matrix_file: reports/emotion_transition_matrix.csv
    statistical_tests_file: reports/phase5_statistical_tests.csv
  network:
    edge_file: reports/behavior_network_edges.csv
    node_file: reports/behavior_network_nodes.csv
    graph_file: data/processed/advanced_analytics/behavior_network.graphml
  events:
    output_file: reports/event_window_analysis.csv
    windows:
      - name: gpt4_release
        date: "2023-03-14"
        days_before: 30
        days_after: 30
      - name: chatgpt_ios_release
        date: "2023-05-18"
        days_before: 30
        days_after: 30
  figures:
    behavior_trends_file: figures/phase5_behavior_trends.html
    archetype_file: figures/archetype_distribution.html
    network_file: figures/behavior_network.html
  report_file: reports/phase5_advanced_analytics_report.md
  manifest_file: reports/phase5_advanced_analytics_manifest.json

dashboard:
  app_file: dashboard/app.py
  page_title: Human-AI Behavior Observatory
  page_icon: HA
  max_prompt_rows: 50000
  default_sample_rows: 10000
  sample_random_state: 42
  sample_file: data/processed/dashboard/classified_prompt_dashboard_sample.parquet
  sample_rows: 50000
  classified_data_file: data/processed/classification/classified_prompts.parquet
  behavior_trends_file: reports/phase5_behavior_trends.csv
  interaction_transition_file: reports/interaction_transition_matrix.csv
  emotion_transition_file: reports/emotion_transition_matrix.csv
  archetype_summary_file: reports/archetype_summary.csv
  archetype_assignments_file: data/processed/advanced_analytics/archetype_assignments.parquet
  network_nodes_file: reports/behavior_network_nodes.csv
  network_edges_file: reports/behavior_network_edges.csv
  event_window_file: reports/event_window_analysis.csv
  taxonomy_coverage_file: reports/taxonomy_coverage.csv
  classification_summary_file: reports/classification_summary.csv
  classification_benchmark_file: reports/classification_benchmark.csv
  phase5_manifest_file: reports/phase5_advanced_analytics_manifest.json
  output_manifest_file: reports/dashboard_manifest.json
